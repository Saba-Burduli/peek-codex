name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.2
          cache: true
          cache-dependency-path: go.sum
      - run: go mod verify
      - run: test -z "$(gofmt -l .)"
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly -race ./...
      - run: sh scripts/test-launcher.sh
      - run: go build -mod=readonly -o /tmp/peek-codex ./cmd/peek-codex
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
