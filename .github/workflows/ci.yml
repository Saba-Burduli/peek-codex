name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.2
      - run: go mod verify
      - run: test -z "$(gofmt -l .)"
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly -race ./...
      - run: go build -mod=readonly -o /tmp/peek-codex ./cmd/peek-codex
